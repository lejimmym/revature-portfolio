spring.application.name=demo


info.app.name=My swag app
logging.level.com.spring.demo.rest=debug
logging.logback.rollingpolicy.file-name-pattern=logs/app.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

spring.datasource.url=jdbc:postgresql://localhost:5432
spring.datasource.username=username
spring.datasource.password=password

#None of these are a replacement for a full replacement tool like flyway
#These are good for prototyping..
spring.jpa.hibernate.ddl-auto=update
#update try to update the db to match our entities
#validate dont mod anything just check is schema  matches mappings
#create drop and recreates the schema every time the app starts
#drop create the scheme on startup nd rops it when the app shuts down

#Google flyway? in the world of java.. Tracking schema changes over time